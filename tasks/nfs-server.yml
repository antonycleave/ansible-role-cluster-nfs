---

- name: Install nfs_server_packages
  ansible.builtin.package:
    name: "{{ nfs_server_packages }}"
    state: present

- name: ensure exported path exists
  file:
    path: "{{ item.get('nfs_export', nfs_export) }}"
    state: directory

- block:
    - name: create filesystem on disk
      filesystem:
        fstype: "{{ item.get('nfs_fstype', nfs_fstype) }}"
        dev: "{{ item.get('nfs_disk_location', nfs_disk_location) }}"
        resizefs: true
    - name: mount filesystem
      mount:
        path: "{{ item.get('nfs_export', nfs_export) }}"
        src: "{{ item.get('nfs_disk_location', nfs_disk_location) }}"
        fstype: "{{ item.get('nfs_fstype', nfs_fstype) }}"
        state: mounted
    - name: grow filesystem after mounting (xfs requires to be mounted)
      filesystem:
        fstype: "{{ item.get('nfs_fstype', nfs_fstype) }}"
        dev: "{{ item.get('nfs_disk_location', nfs_disk_location) }}"
        resizefs: true
  when: nfs_disk_location is not none

- name: update exports file
  lineinfile:
    path: /etc/exports
    regexp: "{{ item.get('nfs_export', nfs_export) }}"
    # uses -$OPTIONS format to set default options for all clients
    line: "{{ item.get('nfs_export', nfs_export) }} -{{ item.get('nfs_export_options', nfs_export_options) }} {{ item.get('nfs_export_clients', nfs_export_clients) }}"
  notify: re-export filesystem

- name: nfs-server-threads
  ansible.builtin.lineinfile:
    insertafter: "[nfsd]"
    path: /etc/nfs.conf
    line: threads="{{ nfs_server_num_threads }}"

- name: ensure nfs service is running
  service:
    name: nfs-server
    state: started
    enabled: yes

- name: Read current nfsd thread count
  become: true
  ansible.builtin.command: cat /proc/fs/nfsd/threads
  register: nfsd_threads
  changed_when: false

- name: Set nfsd thread count live (no restart)
  become: true
  ansible.builtin.shell: |
    echo {{ nfs_server_num_threads | int }} > /proc/fs/nfsd/threads
  args:
    executable: /bin/bash
  when: (nfsd_threads.stdout | int) != (nfs_server_num_threads | int)

- name: flush handlers
  meta: flush_handlers
