---

- name: Install nfs_client_packages
  ansible.builtin.package:
    name: "{{ nfs_client_packages }}"
    state: present

# Client-side read-ahead in /etc/nfs.conf. Distinct INI section from
# the server-side [nfsd] threads setting (nfs-server.yml), so the two
# coexist without conflict. Applied at mount time by the nfsrahead
# helper, so existing mounts pick it up on the next (re)mount.
- name: Configure NFS client read-ahead in /etc/nfs.conf
  community.general.ini_file:
    path: /etc/nfs.conf
    section: nfsrahead
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ nfs_client_rahead | dict2items }}"
  when: nfs_client_rahead | length > 0

- name: check if mount directory exists
  stat:
    path: "{{ item.get('nfs_client_mnt_point', nfs_client_mnt_point) }}"
  register: _nfs_mountpoint
  failed_when: false
- name: unmount stale nfs mount
  mount:
    path: "{{ item.get('nfs_client_mnt_point', nfs_client_mnt_point) }}"
    state: unmounted
  when: "'Stale file handle' in _nfs_mountpoint.msg | default('')"
- name: ensure mount directory exists
  file:
    path: "{{ item.get('nfs_client_mnt_point', nfs_client_mnt_point) }}"
    state: directory
- name: mount the filesystem
  mount:
    path: "{{ item.get('nfs_client_mnt_point', nfs_client_mnt_point) }}"
    src: "{{ item.get('nfs_server', nfs_server | default( nfs_server_default )) }}:{{ item.get('nfs_export', nfs_export) }}"
    opts: "{{ item['nfs_client_mnt_options'] | default(nfs_client_mnt_options, true) | default(omit, true) }}" # for some reason items.get() here fails with "an incorrect mount option was specified"
    fstype: nfs
    state: "{{ item.get('nfs_client_mnt_state', nfs_client_mnt_state) }}"
